[project]
name = "flux"
version = "0.1.0"
description = "Computer-use automation: LLM discovery -> reusable artifact -> deterministic replay for legacy banking back-office UIs"
requires-python = ">=3.11"
readme = "README.md"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE"]
dependencies = [
    "playwright>=1.47",
    "pydantic>=2.9",
    "anthropic>=0.34",
    "click>=8.1",
    "flask>=3.0",
    "python-dotenv>=1.0",
    "fastapi>=0.115",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-playwright>=0.5",
    "httpx>=0.27",
]

[project.scripts]
flux = "flux.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["flux*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
